<text x="112" y="408" dominant-baseline="central" style="fill:rgb(194,192,182);font-family:'Helvetica Neue',Arial,sans-serif;font-size:12px;">· · ·  3 000 × REQ</text>
<text x="360" y="328" text-anchor="start" dominant-baseline="central" font-weight="500" style="fill:rgb(194,192,182);font-family:'Helvetica Neue',Arial,sans-serif;font-size:12px;">prefill-heavy</text>
<text x="360" y="345" text-anchor="start" dominant-baseline="central" style="fill:rgb(194,192,182);font-family:'Helvetica Neue',Arial,sans-serif;font-size:12px;">Example of paper summary workload</text>
<text x="360" y="362" text-anchor="start" dominant-baseline="central" style="fill:rgb(194,192,182);font-family:'Helvetica Neue',Arial,sans-serif;font-size:12px;">Long pipeline residency per request</text>
<text x="360" y="379" text-anchor="start" dominant-baseline="central" style="fill:rgb(194,192,182);font-family:'Helvetica Neue',Arial,sans-serif;font-size:12px;">Few requests needed to keep GPU pipeline busy</text>
<line x1="30" y1="430" x2="650" y2="430" stroke="rgba(222,220,209,0.15)" stroke-width="0.5"/>
<!-- === Legend === -->
<rect x="140" y="450" width="14" height="10" rx="2" fill="#e05050"/>
<text x="158" y="455" dominant-baseline="central" style="fill:rgb(194,192,182);font-family:'Helvetica Neue',Arial,sans-serif;font-size:12px;">Prefill (ISL)</text>
<rect x="240" y="450" width="14" height="10" rx="2" fill="#a3e635"/>
<text x="258" y="455" dominant-baseline="central" style="fill:rgb(194,192,182);font-family:'Helvetica Neue',Arial,sans-serif;font-size:12px;">Decode (OSL)</text>
</svg>
